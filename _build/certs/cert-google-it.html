<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Glancyr;src:url(Glancyr-Neue-Regular.otf)}
html,body{margin:0;width:630px;height:430px;overflow:hidden}
body{background:radial-gradient(120% 120% at 85% 10%,#3a2326 0%,#1e2024 55%,#16171a 100%);color:#fff;font-family:Glancyr,sans-serif;position:relative}
.ring{position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:#f25749;opacity:.9}
.ring2{position:absolute;right:40px;top:30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(2px)}
.mark{position:absolute;right:62px;top:82px;font-size:30px;letter-spacing:2px}
.label{position:absolute;left:44px;top:44px;font-size:13px;letter-spacing:4px;text-transform:uppercase;color:#f25749}
.title{position:absolute;left:44px;right:44px;bottom:96px;font-size:36px;line-height:1.15}
.issuer{position:absolute;left:44px;bottom:48px;font-size:16px;color:rgba(255,255,255,.7);letter-spacing:1px}
.line{position:absolute;left:44px;right:44px;bottom:80px;height:1px;background:rgba(255,255,255,.15)}
</style></head><body><div class="ring"></div><div class="ring2"></div><div class="mark">IT</div>
